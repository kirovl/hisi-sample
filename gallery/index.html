<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV610 截图</title>
<style>body{margin:0;background:#101622;color:#e8edf5;font:15px system-ui,sans-serif}header{padding:20px 4vw;background:#192336;position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:20px}h1{font-size:22px;margin:0}button,a{color:#a4cfff}button{background:#243d5b;border:1px solid #496486;border-radius:7px;padding:8px 14px;cursor:pointer}#status{color:#a7b6ca}main{padding:24px 4vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px}article{border:1px solid #334258;border-radius:12px;padding:14px;background:#192231}img{width:100%;height:auto;display:block;border-radius:5px;background:#000}p{margin:10px 0;overflow-wrap:anywhere}.meta{color:#adc1d7;font-size:13px}nav{display:flex;gap:18px}#empty{padding:24px 4vw;color:#a7b6ca}</style>
<header><h1>CV610 摄像头截图</h1><span id="status">正在读取…</span><button id="refresh">刷新</button></header><div id="empty" hidden>尚无截图，请点击开发板屏幕右上角 SNAPSHOT。</div><main id="gallery"></main>
<script>
const gallery=document.getElementById('gallery'),status=document.getElementById('status');let last='';
async function refresh(){try{const r=await fetch('index.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const names=await r.json();names.sort((a,b)=>Number(b.split('-')[1])-Number(a.split('-')[1])||Number(b.split('-')[3]?.split('.')[0])-Number(a.split('-')[3]?.split('.')[0]));status.textContent=names.length+' 张 · 每 3 秒检查新截图';document.getElementById('empty').hidden=names.length!==0;const key=names.join('|');if(key===last)return;last=key;gallery.replaceChildren();for(const name of names.slice(0,60)){if(!/^shot-[0-9]+-[0-9]+-[0-9]+\.png$/.test(name))continue;const card=document.createElement('article'),img=document.createElement('img'),view=document.createElement('a'),title=document.createElement('p'),meta=document.createElement('p'),nav=document.createElement('nav'),download=document.createElement('a'),json=document.createElement('a');img.src=encodeURIComponent(name);img.alt=name;img.loading='lazy';view.href=img.src;view.target='_blank';view.append(img);title.textContent=name;meta.className='meta';meta.textContent='读取检测信息…';download.href=img.src;download.download=name;download.textContent='下载原始 PNG';json.href=encodeURIComponent(name.replace(/\.png$/,'.json'));json.target='_blank';json.textContent='检测结果 JSON';nav.append(download,json);card.append(view,title,meta,nav);gallery.append(card);fetch(json.href,{cache:'no-store'}).then(r=>r.json()).then(d=>{meta.textContent='相机 '+d.sensor.join('×')+' / '+d.sensor_fps.toFixed(1)+' fps · 处理 '+d.processing_fps.toFixed(1)+' fps · '+d.objects.length+' 个结果'+(d.objects.length?' · '+d.objects.map(o=>o.class+' '+Math.round(o.confidence*100)+'%').join(', '):'');}).catch(()=>{meta.textContent='PNG 已就绪；元数据暂不可用';});}}catch(e){status.textContent='读取失败，请检查开发板连接';}}
document.getElementById('refresh').onclick=refresh;refresh();setInterval(refresh,3000);
</script></html>
